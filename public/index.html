<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>URL Shortner</h1>
      <form id="shorten-form">
        <div>
          <label for="url">Enter URL:</label>
          <input type="url" name="url" id="url" required />
        </div>
        <div>
          <label for="shortCode">Enter shortCode:</label>
          <input type="text" name="shortCode" id="shortCode" required />
        </div>
        <button type="submit">Shorten</button>
      </form>
      <h2>Shortened URLs</h2>
      <ul id="shortened-urls"></ul>
    </div>
    <script>
            //9)
            const fetchShortenedURL = async () => {
              try{    
              const response = await fetch("/links");//if req.url===links
              if(!response.ok){
                throw new Error("Failed to fetch links");
              }
              
              const links = await response.json(); 
              //why we are not using JSON.parse(response);to convert into a js object
              const list = document.getElementById("shortened-urls");
              list.innerHTML = "";
              for (const [shortCode, url] of Object.entries(links)) {
                if(!shortCode || !url) continue;
                const li = document.createElement("li");
                li.innerHTML = `<a href="/${shortCode}" target="_blank">
                  ${window.location.origin}/${shortCode}
                  </a> -> ${url}`;
                list.appendChild(li);
              }
              }catch(error){
              console.log(error);
              }
            };
//1)
            document
              .getElementById("shorten-form")
              .addEventListener("submit", async (event) => {
                event.preventDefault();
                //to get the value written in input field by user
                const formData = new FormData(event.target); //this single line of code can handle and print enumerous number of input fields
                const url = formData.get("url"); //name is passed(url),stores data of input entered by user
                const shortCode = formData.get("shortCode"); //name is passed
                if(!url){
                  alert("URL is required");
                  return;
                }
                console.log(url, shortCode); //this will print input field of both url and shortCode in console
                //8)after creating backend;from frontend,we will request shorten api to communicate with backend and send data with the help of fetch method
                try {
                  const response = await fetch("/shorten", {
                    //means if req.url===/shorten
                    method: "POST", //using post method means passing data,if req.method===POST
                    headers: { "Content-Type": "application/json" }, //json data is send
                    body: JSON.stringify({ url, shortCode }), //data sharing in backend of url and shortcode entered by user is done here
                  });
                  if (response.ok) {
                    fetchShortenedURL(); //show when submitted
                    alert("Form submitted successfully");
                    event.target.reset();
                  } else {
                    const errorMessage = await response.text();
                    alert(errorMessage);
                  }
                } catch (error) {
                  console.log(error);
                }
              });
            fetchShortenedURL(); //to show when page refresh
    </script>
  </body>
</html>
